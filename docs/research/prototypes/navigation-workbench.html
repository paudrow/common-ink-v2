<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Bar Workbench</title>
<style>
/* The app's tokens (web/src/style.css), so the prototype reads like Common Ink. */
:root {
  color-scheme: light dark;
  --bg: #fbfaf8;
  --ink: #1f1e1c;
  --muted: #6f6b66;
  --line: #e7e4df;
  --accent: #2f5fd0;
  --selection: #d6e0f7;
  --accent-soft: rgb(47 95 208 / 0.14);
  --code-bg: rgb(31 30 28 / 0.05);
  --hover: rgb(31 30 28 / 0.06);
  --bg-elev: #ffffff;
  --line-strong: #d6d2cb;
  --faint: #a9a49d;
  --ink-2: #3d3a36;
  --accent-ink: #2450b8;
  --on-accent: #ffffff;
  --bad: #c2410c;
  --warn: #b7791f;
  --ok: #2f8f5b;
  --agent: #7a4fc4;
  --agent-soft: rgb(122 79 196 / 0.12);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.14), 0 2px 6px rgb(0 0 0 / 0.08);
  --prose: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-family: var(--prose);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --ink: #e8e6e3; --muted: #9a958f; --line: #2c2b29; --accent: #8fb0ff;
    --selection: #2c3a5c; --accent-soft: rgb(143 176 255 / 0.16); --code-bg: rgb(232 230 227 / 0.06);
    --hover: rgb(232 230 227 / 0.08); --bg-elev: #22211f; --line-strong: #3d3b38; --faint: #6b6762;
    --ink-2: #cfccc7; --accent-ink: #a9c2ff; --on-accent: #10131a; --bad: #f0855a; --warn: #e0a84a;
    --ok: #5cc28c; --agent: #b99cf0; --agent-soft: rgb(185 156 240 / 0.14);
    --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.3);
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --ink: #e8e6e3; --muted: #9a958f; --line: #2c2b29; --accent: #8fb0ff;
  --selection: #2c3a5c; --accent-soft: rgb(143 176 255 / 0.16); --code-bg: rgb(232 230 227 / 0.06);
  --hover: rgb(232 230 227 / 0.08); --bg-elev: #22211f; --line-strong: #3d3b38; --faint: #6b6762;
  --ink-2: #cfccc7; --accent-ink: #a9c2ff; --on-accent: #10131a; --bad: #f0855a; --warn: #e0a84a;
  --ok: #5cc28c; --agent: #b99cf0; --agent-soft: rgb(185 156 240 / 0.14);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
kbd { font-family: var(--mono); font-size: 0.75rem; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3rem; color: var(--ink-2); background: var(--bg-elev); white-space: nowrap; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Tabs and status bar, as the app draws them. */
.tabs { display: flex; border-bottom: 1px solid var(--line); min-height: 33px; overflow-x: auto; flex: none; }
.tab { padding: 0.45rem 0.75rem; font-size: 0.8125rem; color: var(--muted); border-right: 1px solid var(--line); display: flex; gap: 0.5rem; align-items: center; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.tab .x { color: var(--faint); font-size: 0.8rem; }
.status { grid-area: status; display: flex; gap: 1rem; padding: 0.3rem 1rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); border-top: 1px solid transparent; }
.status .grow { flex: 1; }

/* Rendered markdown (cards and notes). */
.md h1 { font-size: 1.05rem; margin: 0 0 0.35rem; }
.md h2 { font-size: 0.95rem; margin: 0.6rem 0 0.25rem; }
.md h3 { font-size: 0.9rem; margin: 0.5rem 0 0.2rem; }
.md p { margin: 0.25rem 0; line-height: 1.5; }
.md ul { margin: 0.25rem 0; padding-left: 1.25rem; }
.md li { line-height: 1.5; }
.md li.task { list-style: none; margin-left: -1.25rem; display: flex; gap: 0.45rem; align-items: baseline; }
.md li.task input { margin: 0; accent-color: var(--accent); transform: translateY(1px); }
.md li.task.done span { color: var(--muted); text-decoration: line-through; }
.md code { font-family: var(--mono); font-size: 0.85em; background: var(--code-bg); padding: 0 0.25rem; border-radius: 3px; }
.md a, .md .wikilink { color: var(--accent-ink); text-decoration: none; }
.chip { display: inline-flex; gap: 0.35rem; align-items: center; border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 0.4rem; font-size: 0.85em; background: var(--bg-elev); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.chip .when { color: var(--muted); }
.due { font-size: 0.75rem; border-radius: 4px; padding: 0 0.3rem; background: var(--code-bg); color: var(--muted); font-family: var(--mono); }
.due.over { color: var(--bad); }
.embed-ph { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; padding: 0.35rem 0.6rem; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); font-size: 0.8125rem; }
.embed-ph b { color: var(--ink-2); font-weight: 600; }
.embed-live { margin: 0.35rem 0; padding: 0.5rem 0.6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-elev); font-size: 0.8125rem; }
.embed-live .big { font-family: var(--mono); font-size: 1.2rem; }
.embed-live .cal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
.embed-live .cal div { border-left: 2px solid var(--accent); padding-left: 0.4rem; }
.embed-live .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
.embed-live .board div { background: var(--code-bg); border-radius: 4px; padding: 0.3rem; }

/* Authors */
.who { font-weight: 600; color: var(--ink-2); }
.who.agent { color: var(--agent); }
.badge { font-size: 0.7rem; border-radius: 999px; padding: 0 0.4rem; background: var(--code-bg); color: var(--muted); }
.badge.agent { background: var(--agent-soft); color: var(--agent); }
.badge.archived { background: var(--code-bg); color: var(--muted); }
.stat { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.stat .add { color: var(--ok); }
.stat .del { color: var(--bad); }

/* Overlays: toast, dialogs, the keys sheet and the prototype's controls. */
.toast { position: fixed; left: 50%; bottom: 2.5rem; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 0.8125rem; box-shadow: var(--shadow-lg); display: flex; gap: 0.75rem; align-items: center; z-index: 50; }
.toast button { color: var(--bg); text-decoration: underline; }
.toast kbd { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.25); display: grid; place-items: start center; padding-top: 12vh; z-index: 40; }
.dialog { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); width: min(680px, 92vw); max-height: 72vh; display: flex; flex-direction: column; overflow: hidden; }
.dialog.small { width: min(420px, 92vw); padding: 1rem 1.1rem; gap: 0.6rem; }
.dialog .row { display: flex; gap: 0.5rem; justify-content: flex-end; }
.btn { border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.25rem 0.7rem; background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.keys-sheet { padding: 1rem 1.25rem; overflow: auto; columns: 2; column-gap: 2rem; font-size: 0.8125rem; }
.keys-sheet h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0.75rem 0 0.35rem; break-after: avoid; }
.keys-sheet div { display: flex; justify-content: space-between; gap: 1rem; padding: 0.12rem 0; break-inside: avoid; }
.proto { position: fixed; right: 0.75rem; bottom: 2rem; z-index: 30; font-size: 0.75rem; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 0.55rem 0.7rem; display: grid; gap: 0.35rem; min-width: 220px; }
.proto[hidden] { display: none; }
.proto b { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.proto label { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
.proto select, .proto button { font: inherit; font-size: 0.75rem; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--ink); padding: 0.1rem 0.3rem; }


body { display: grid; grid-template: "bar side main sec" 1fr "bar side bottom sec" auto "status status status status" auto / 44px var(--side-w, 17.5rem) 1fr var(--sec-w, 0px); }
body.no-side { --side-w: 0px; }
body.no-side #side { display: none; }
body.sec-open { --sec-w: 17rem; }
#bar { grid-area: bar; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 0.4rem 0; gap: 0.15rem; }
#bar .grow { flex: 1; }
.act { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; color: var(--faint); position: relative; }
.act svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.act:hover { color: var(--ink); }
.act[aria-pressed="true"] { color: var(--ink); }
.act[aria-pressed="true"]::before { content: ""; position: absolute; left: -4px; top: 8px; bottom: 8px; width: 2px; background: var(--accent); }
.act.cursor { outline: 1px solid var(--accent); }
.act .badge { position: absolute; right: 1px; top: 2px; font-size: 0.6rem; background: var(--agent); color: #fff; padding: 0 0.25rem; }
.act.dragging { opacity: 0.4; }
#side { grid-area: side; border-right: 1px solid var(--line); overflow: auto; font-size: 0.8125rem; display: flex; flex-direction: column; min-height: 0; }
#side > h2, #sec > h2 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; padding: 0.7rem 0.8rem 0.4rem; font-weight: 600; display: flex; justify-content: space-between; }
.section > .sh { display: flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.5rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: var(--ink-2); border-top: 1px solid var(--line); cursor: pointer; }
.section > .sh .chev { width: 0.8rem; color: var(--muted); }
.section > .sh .n { margin-left: auto; font-weight: 400; color: var(--faint); }
.section > .sh .more { color: var(--muted); padding: 0 0.3rem; }
.section > .sh.cursor { outline: 1px solid var(--accent); outline-offset: -1px; }
.item { display: flex; gap: 0.45rem; align-items: baseline; padding: 0.2rem 0.6rem 0.2rem 1.3rem; cursor: pointer; white-space: nowrap; }
.item .t { overflow: hidden; text-overflow: ellipsis; flex: 1; color: var(--ink-2); }
.item .r { font-size: 0.7rem; color: var(--faint); }
.item .a { width: 6px; height: 6px; border-radius: 50%; flex: none; transform: translateY(-1px); background: transparent; }
.item .a.agent { background: var(--agent); }
.item:hover { background: var(--hover); }
.item.cursor { background: var(--selection); }
.item.leaving { opacity: 0.2; }
.item .sub { display: block; font-size: 0.72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.item.two { flex-direction: column; gap: 0; align-items: stretch; }
.item.two .l { display: flex; gap: 0.45rem; align-items: baseline; }
.field { margin: 0 0.7rem 0.4rem; display: flex; gap: 0.3rem; align-items: center; }
.field input, .field select { font: inherit; font-size: 0.8rem; flex: 1; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0.2rem 0.4rem; background: var(--bg-elev); color: var(--ink); min-width: 0; }
.field label { font-size: 0.72rem; color: var(--muted); width: 2.6rem; }
.field .tog { font-family: var(--mono); font-size: 0.7rem; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0.1rem 0.3rem; color: var(--muted); }
.field .tog[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.hit { padding: 0.12rem 0.6rem 0.12rem 2rem; color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.hit mark { background: var(--accent-soft); color: var(--ink); }
.hit.cursor { background: var(--selection); }
#main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#editor { flex: 1; overflow: auto; }
.note { max-width: 42rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; font-size: 0.95rem; }
.note .md h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
.note .crumbs { font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; display: flex; gap: 0.5rem; }
.banner { border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.4rem 0.7rem; font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: center; }
.welcome { color: var(--muted); text-align: center; padding-top: 18vh; font-size: 0.85rem; line-height: 2; }
#bottom { grid-area: bottom; border-top: 1px solid var(--line); height: 13rem; display: flex; flex-direction: column; font-size: 0.78rem; min-width: 0; }
#bottom[hidden] { display: none; }
#bottom .btabs { display: flex; gap: 0.75rem; padding: 0.3rem 0.8rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
#bottom .btabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
#bottom .btabs .grow { flex: 1; }
#bottom .bbody { overflow: auto; padding: 0 0.8rem 0.5rem; font-family: var(--mono); }
.logrow { display: grid; grid-template-columns: 5.5rem 9rem 1fr 5rem; gap: 0.75rem; padding: 0.1rem 0; }
.logrow.cursor { background: var(--selection); }
#sec { grid-area: sec; border-left: 1px solid var(--line); overflow: auto; font-size: 0.8125rem; display: none; }
body.sec-open #sec { display: block; }
.change { padding: 0.35rem 0.8rem; border-bottom: 1px solid var(--line); }
.menu { position: fixed; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 0.25rem; z-index: 45; min-width: 13rem; font-size: 0.8125rem; }
.menu div { padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
.menu div.focus, .menu div:hover { background: var(--hover); }
.qo input { font: inherit; font-size: 1rem; border: 0; border-bottom: 1px solid var(--line); padding: 0.8rem 1rem; background: transparent; color: var(--ink); outline: none; width: 100%; }
.qo .res { padding: 0.3rem 0.9rem; display: flex; gap: 0.6rem; }
.qo .res.focus { background: var(--selection); }
.qo .res .d { color: var(--muted); font-size: 0.8rem; }
.ev { border-left: 3px solid var(--accent); padding: 0.15rem 0.5rem; margin: 0.2rem 0.6rem 0.2rem 1.3rem; cursor: pointer; }
.ev.cursor { background: var(--selection); }
.ev .tm { color: var(--muted); font-size: 0.72rem; }
.callout { font-size: 0.78rem; color: var(--muted); padding: 0.4rem 0.9rem; }
@media (max-width: 760px) { body { --side-w: 0px; } #side, #sec { display: none !important; } }
</style>
</head>
<body>
<nav id="bar" aria-label="Activity bar"></nav>
<aside id="side" aria-label="Side bar"></aside>
<main id="main"><div class="tabs" id="tabs"></div><div id="editor"></div></main>
<section id="bottom" hidden aria-label="Panel"></section>
<aside id="sec" aria-label="Secondary side bar"></aside>
<footer class="status" id="status"></footer>
<div class="proto" id="proto" hidden>
  <b>Prototype controls</b>
  <label>Theme <select id="pTheme"><option value="">System</option><option>light</option><option>dark</option></select></label>
  <button id="pAgent">Simulate an agent's edit</button>
  <span class="muted">Drag icons in the activity bar to reorder. <kbd>?</kbd> keys.</span>
</div>
<script>
// ---- Sample workspace: notes, events, contacts, commands and settings, on a fixed clock. ----
const NOW = new Date("2026-10-05T09:00:00").getTime();
const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? "⌘" : "Ctrl-";

const AGENTS = { claude: "Claude", research: "Research agent", sync: "Google Calendar sync" };

/** A note: its path, text, and its last change (who, when, how big). */
const SEED_NOTES = [
  { path: "Projects/Launch plan.md", ago: 4 * MIN, by: "claude", add: 12, del: 3, summary: "Added a risks section and two tasks", pinned: true,
    text: `# Launch plan\n\nShip the public beta on **Oct 20**. Agents keep the checklist current.\n\n## This week\n- [x] Freeze the onboarding copy\n- [ ] Record the demo video due:2026-10-07\n- [ ] Draft the changelog post due:2026-10-04\n- [ ] Ask [[Sam Rivera]] to review pricing\n\n## Risks\n- Google's test app ends grants after 7 days\n- Import from v1 isn't done` },

  { path: "Research/Reading list.md", ago: 70 * MIN, by: "research", add: 9, del: 0, summary: "Added 3 links on feed design",
    text: `# Reading list\n\nCollected by the research agent; tick what you've read.\n\n- [ ] Readwise Reader: the triage workflow\n- [ ] Superhuman: getting to inbox zero\n- [x] VS Code: custom layout\n- [ ] Obsidian: search operators` },

    text: `# Dal\n\n- 1 cup red lentils\n- 1 onion, 3 cloves garlic, ginger\n- Turmeric, cumin, chili\n\nSimmer 20 minutes. Temper the spices in ghee last.` },

function ago(ms) {

  if (ms < 2 * DAY) return "yesterday";

function renderMarkdown(text, { live = false, limit = Infinity, noteIndex = -1 } = {}) {

function activate(how) {

function openTab(t, how) {

function renderTabs() {

function renderBottom() {

function renderSec() {

}
function renderStatus() {
  $("#status").innerHTML = `<span>NORMAL</span><span>Saved</span><span class="grow"></span><span>${S.pending ? `<kbd>${S.pending}</kbd>` : S.focus === "side" ? "j/k · ↵ open · e archive · # trash · p pin · u undo · Space fold" : "Ctrl-W h side bar"}</span><span>? keys</span><button id="protoBtn" class="mono" style="font-size:0.72rem;color:var(--muted)">⚙ prototype</button><span>2026-10-05 09:00</span>`;

}
function toast(text, undo) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.innerHTML = `<span>${text}</span>${undo ? '<button>Undo</button> <kbd>u</kbd>' : ""}`;
  if (undo) el.querySelector("button").onclick = doUndo;
  document.body.append(el); setTimeout(() => el.remove(), 4500);
}
function doUndo() { const u = S.undo.pop(); if (u) { u(); toast("Undone"); render(); } }
function archive(n, on = true) { const was = n.archived; n.archived = on; S.undo.push(() => (n.archived = was)); toast(`${on ? "Archived" : "Unarchived"} “${esc(titleOf(n))}”`, true); render(); }
function trash(n) { const i = S.notes.indexOf(n); S.notes.splice(i, 1); const x = { note: n, deletedAgo: 0, by: "you" }; S.trash.unshift(x); S.undo.push(() => { S.trash.splice(S.trash.indexOf(x), 1); S.notes.splice(i, 0, n); }); toast(`Moved “${esc(titleOf(n))}” to Trash`, true); render(); }
function restore(x) { S.trash.splice(S.trash.indexOf(x), 1); x.note.ago = 0; x.note.by = "you"; S.notes.unshift(x.note); toast(`Restored “${esc(titleOf(x.note))}”`); render(); }

let menu = null;
function viewMenu(section, anchor) {

  const r = anchor.getBoundingClientRect(); menu.style.left = r.left + "px"; menu.style.top = r.bottom + 4 + "px";

}
function closeMenu() { if (menu) menu.remove(); menu = null; }
function quickOpen() {

function keysSheet() {
  const s = document.createElement("div"); s.className = "scrim";

  s.innerHTML = `<div class="dialog"><div class="keys-sheet">${g("Containers", [[MOD + "⇧E", "Notes"], [MOD + "⇧F", "Search"], [MOD + "⇧C", "Calendar"], [MOD + "⇧T", "Tasks"], [MOD + "⇧S", "Sources"], [MOD + "B", "Toggle side bar"], [MOD + "J", "Toggle panel"], [MOD + "⌥B", "Secondary side bar"], [MOD + "P", "Open by name"]])}${g("Side bar lists", [["j k", "Move"], ["↵", "Open (preview tab)"], ["l", "Open and keep"], ["Space", "Fold a section"], ["e", "Archive"], ["#", "Trash"], ["p", "Pin"], ["r", "Restore (in Trash)"], ["u", "Undo"], ["m", "Move this view"]])}${g("Focus", [["Ctrl-W h", "Left"], ["Ctrl-W l", "Right"], ["Ctrl-W j", "Panel"]])}</div></div>`;

document.addEventListener("keydown", (e) => {

});
$("#pTheme").onchange = (e) => { if (e.target.value) document.documentElement.dataset.theme = e.target.value; else delete document.documentElement.dataset.theme; };
