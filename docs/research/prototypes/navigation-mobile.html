<title>Mobile-First Places</title>
<style>
/* The app's tokens (web/src/style.css), so the prototype reads like Common Ink. */
:root {
  color-scheme: light dark;
  --bg: #fbfaf8;
  --ink: #1f1e1c;
  --muted: #6f6b66;
  --line: #e7e4df;
  --accent: #2f5fd0;
  --selection: #d6e0f7;
  --accent-soft: rgb(47 95 208 / 0.14);
  --code-bg: rgb(31 30 28 / 0.05);
  --hover: rgb(31 30 28 / 0.06);
  --bg-elev: #ffffff;
  --line-strong: #d6d2cb;
  --faint: #a9a49d;
  --ink-2: #3d3a36;
  --accent-ink: #2450b8;
  --on-accent: #ffffff;
  --bad: #c2410c;
  --warn: #b7791f;
  --ok: #2f8f5b;
  --agent: #7a4fc4;
  --agent-soft: rgb(122 79 196 / 0.12);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.14), 0 2px 6px rgb(0 0 0 / 0.08);
  --prose: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-family: var(--prose);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --ink: #e8e6e3; --muted: #9a958f; --line: #2c2b29; --accent: #8fb0ff;
    --selection: #2c3a5c; --accent-soft: rgb(143 176 255 / 0.16); --code-bg: rgb(232 230 227 / 0.06);
    --hover: rgb(232 230 227 / 0.08); --bg-elev: #22211f; --line-strong: #3d3b38; --faint: #6b6762;
    --ink-2: #cfccc7; --accent-ink: #a9c2ff; --on-accent: #10131a; --bad: #f0855a; --warn: #e0a84a;
    --ok: #5cc28c; --agent: #b99cf0; --agent-soft: rgb(185 156 240 / 0.14);
    --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.3);
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --ink: #e8e6e3; --muted: #9a958f; --line: #2c2b29; --accent: #8fb0ff;
  --selection: #2c3a5c; --accent-soft: rgb(143 176 255 / 0.16); --code-bg: rgb(232 230 227 / 0.06);
  --hover: rgb(232 230 227 / 0.08); --bg-elev: #22211f; --line-strong: #3d3b38; --faint: #6b6762;
  --ink-2: #cfccc7; --accent-ink: #a9c2ff; --on-accent: #10131a; --bad: #f0855a; --warn: #e0a84a;
  --ok: #5cc28c; --agent: #b99cf0; --agent-soft: rgb(185 156 240 / 0.14);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
kbd { font-family: var(--mono); font-size: 0.75rem; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3rem; color: var(--ink-2); background: var(--bg-elev); white-space: nowrap; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Tabs and status bar, as the app draws them. */
.tabs { display: flex; border-bottom: 1px solid var(--line); min-height: 33px; overflow-x: auto; flex: none; }
.tab { padding: 0.45rem 0.75rem; font-size: 0.8125rem; color: var(--muted); border-right: 1px solid var(--line); display: flex; gap: 0.5rem; align-items: center; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.tab .x { color: var(--faint); font-size: 0.8rem; }
.status { grid-area: status; display: flex; gap: 1rem; padding: 0.3rem 1rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); border-top: 1px solid transparent; }
.status .grow { flex: 1; }

/* Rendered markdown (cards and notes). */
.md h1 { font-size: 1.05rem; margin: 0 0 0.35rem; }
.md h2 { font-size: 0.95rem; margin: 0.6rem 0 0.25rem; }
.md h3 { font-size: 0.9rem; margin: 0.5rem 0 0.2rem; }
.md p { margin: 0.25rem 0; line-height: 1.5; }
.md ul { margin: 0.25rem 0; padding-left: 1.25rem; }
.md li { line-height: 1.5; }
.md li.task { list-style: none; margin-left: -1.25rem; display: flex; gap: 0.45rem; align-items: baseline; }
.md li.task input { margin: 0; accent-color: var(--accent); transform: translateY(1px); }
.md li.task.done span { color: var(--muted); text-decoration: line-through; }
.md code { font-family: var(--mono); font-size: 0.85em; background: var(--code-bg); padding: 0 0.25rem; border-radius: 3px; }
.md a, .md .wikilink { color: var(--accent-ink); text-decoration: none; }
.chip { display: inline-flex; gap: 0.35rem; align-items: center; border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 0.4rem; font-size: 0.85em; background: var(--bg-elev); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.chip .when { color: var(--muted); }
.due { font-size: 0.75rem; border-radius: 4px; padding: 0 0.3rem; background: var(--code-bg); color: var(--muted); font-family: var(--mono); }
.due.over { color: var(--bad); }
.embed-ph { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; padding: 0.35rem 0.6rem; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); font-size: 0.8125rem; }
.embed-ph b { color: var(--ink-2); font-weight: 600; }
.embed-live { margin: 0.35rem 0; padding: 0.5rem 0.6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-elev); font-size: 0.8125rem; }
.embed-live .big { font-family: var(--mono); font-size: 1.2rem; }
.embed-live .cal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
.embed-live .cal div { border-left: 2px solid var(--accent); padding-left: 0.4rem; }
.embed-live .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
.embed-live .board div { background: var(--code-bg); border-radius: 4px; padding: 0.3rem; }

/* Authors */
.who { font-weight: 600; color: var(--ink-2); }
.who.agent { color: var(--agent); }
.badge { font-size: 0.7rem; border-radius: 999px; padding: 0 0.4rem; background: var(--code-bg); color: var(--muted); }
.badge.agent { background: var(--agent-soft); color: var(--agent); }
.badge.archived { background: var(--code-bg); color: var(--muted); }
.stat { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.stat .add { color: var(--ok); }
.stat .del { color: var(--bad); }

/* Overlays: toast, dialogs, the keys sheet and the prototype's controls. */
.toast { position: fixed; left: 50%; bottom: 2.5rem; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 0.8125rem; box-shadow: var(--shadow-lg); display: flex; gap: 0.75rem; align-items: center; z-index: 50; }
.toast button { color: var(--bg); text-decoration: underline; }
.toast kbd { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.25); display: grid; place-items: start center; padding-top: 12vh; z-index: 40; }
.dialog { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); width: min(680px, 92vw); max-height: 72vh; display: flex; flex-direction: column; overflow: hidden; }
.dialog.small { width: min(420px, 92vw); padding: 1rem 1.1rem; gap: 0.6rem; }
.dialog .row { display: flex; gap: 0.5rem; justify-content: flex-end; }
.btn { border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.25rem 0.7rem; background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.keys-sheet { padding: 1rem 1.25rem; overflow: auto; columns: 2; column-gap: 2rem; font-size: 0.8125rem; }
.keys-sheet h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0.75rem 0 0.35rem; break-after: avoid; }
.keys-sheet div { display: flex; justify-content: space-between; gap: 1rem; padding: 0.12rem 0; break-inside: avoid; }
.proto { position: fixed; right: 0.75rem; bottom: 2rem; z-index: 30; font-size: 0.75rem; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 0.55rem 0.7rem; display: grid; gap: 0.35rem; min-width: 220px; }
.proto[hidden] { display: none; }
.proto b { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.proto label { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
.proto select, .proto button { font: inherit; font-size: 0.75rem; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--ink); padding: 0.1rem 0.3rem; }


body { display: flex; flex-direction: column; height: 100dvh; background: var(--bg); }
html[data-framed] body { background: color-mix(in srgb, var(--bg) 82%, var(--ink) 18%); }

/* The prototype's own controls: outside the device, never part of the design. */
#rig { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; padding: 0.4rem 0.75rem; font-size: 0.75rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
#rig b { color: var(--ink); font-weight: 600; }
#rig select, #rig button { font: inherit; font-size: 0.75rem; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--bg-elev); color: var(--ink); padding: 0.15rem 0.4rem; }
#rig .caps { font-family: var(--mono); font-size: 0.7rem; }
#rig .grow { flex: 1; }
#rig[data-min] > :not(.keep) { display: none; }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; position: relative; }
#device { position: relative; background: var(--bg); overflow: hidden; container-type: inline-size; width: 100%; height: 100%; }
html[data-framed] #device { position: absolute; left: 50%; top: 50%; border-radius: 22px; box-shadow: 0 0 0 1px var(--line-strong), var(--shadow-lg); transform-origin: center center; flex: none; }

/* ---------- The app ---------- */
#app { position: absolute; inset: 0; display: grid; grid-template-columns: auto auto 1fr auto; grid-template-rows: 1fr auto auto; grid-template-areas: "places list detail ctx" "bar bar bar bar" "osk osk osk osk"; font-size: 15px; }
#app.c-expanded, #app.c-large { font-size: 14px; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
#places { grid-area: places; width: 15rem; border-right: 1px solid var(--line); overflow: auto; }
#list { grid-area: list; }
#detail { grid-area: detail; }
#ctx { grid-area: ctx; width: 18rem; border-left: 1px solid var(--line); }
#app.c-compact #list, #app.c-medium #list { grid-column: 1 / -1; }
#app.c-expanded #list, #app.c-large #list { width: clamp(20rem, 32cqw, 26rem); border-right: 1px solid var(--line); }
#app.c-compact #detail, #app.c-medium #detail { grid-column: 1 / -1; grid-row: 1; }
.pane[hidden], #places[hidden], #ctx[hidden] { display: none !important; }

.top { display: flex; align-items: center; gap: 0.35rem; padding: 0.55rem 0.6rem 0.45rem; min-height: 3rem; flex: none; border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 2; }
.top h1 { font-size: 1.05rem; margin: 0 0.25rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#app.c-compact .top h1 { font-size: 1.2rem; }
.icon { min-width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2); font-size: 1.1rem; }
#app.c-expanded .icon, #app.c-large .icon { min-width: 2rem; height: 2rem; font-size: 0.95rem; }
.icon:active { background: var(--hover); }
.icon.text { font-size: 0.9rem; padding: 0 0.5rem; color: var(--accent-ink); }
.chips { display: flex; gap: 0.35rem; padding: 0.45rem 0.75rem; overflow-x: auto; flex: none; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.chips button { white-space: nowrap; font-size: 0.82rem; padding: 0.3rem 0.75rem; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-2); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips .n { color: var(--agent); margin-left: 0.2rem; font-size: 0.75rem; }
.chips button[aria-pressed="true"] .n { color: inherit; }
.scroll { flex: 1; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.qline { font-family: var(--mono); font-size: 0.68rem; color: var(--faint); padding: 0.35rem 0.85rem 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group { font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); margin: 0.9rem 0.85rem 0.3rem; font-weight: 600; }

/* Cards, with swipe */
.sw { position: relative; margin: 0.4rem 0.6rem; border-radius: 10px; overflow: hidden; touch-action: pan-y; }
.sw .bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 0.85rem; color: #fff; }
.sw .bg span { padding: 0 1.1rem; display: flex; gap: 0.4rem; align-items: center; height: 100%; }
.sw .bg .r { background: var(--ok); }
.sw .bg .l { background: var(--bad); margin-left: auto; }
.sw .bg .r, .sw .bg .l { opacity: 0; }
.sw[data-dir="right"] .bg .r, .sw[data-dir="left"] .bg .l { opacity: 1; flex: 1; }
.sw[data-dir="left"] .bg .l { justify-content: flex-end; }
.sw.armed .bg span { filter: brightness(1.12); }
.card { position: relative; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px; padding: 0.65rem 0.8rem 0.6rem; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform 0.18s ease; cursor: default; }
.card.dragging { transition: none; }
.sw.focus .card { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sw.picked .card { background: color-mix(in srgb, var(--selection) 60%, var(--bg-elev)); }
.sw.current .card { border-left: 3px solid var(--accent); }
.sw.gone { transition: max-height 0.2s, margin 0.2s, opacity 0.2s; max-height: 0 !important; margin-top: 0; margin-bottom: 0; opacity: 0; }
.card .t1 { display: flex; gap: 0.45rem; align-items: baseline; }
.card .title { font-weight: 600; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .folder { font-size: 0.75rem; color: var(--faint); white-space: nowrap; }
.card .when { margin-left: auto; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.card .meta { font-size: 0.78rem; color: var(--muted); margin: 0.1rem 0 0.3rem; display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
.card .preview { font-size: 0.87rem; color: var(--ink-2); max-height: 8.6rem; overflow: hidden; -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
.card .preview h1 { display: none; }
.card .dotu { position: absolute; left: 0.3rem; top: 1rem; width: 6px; height: 6px; border-radius: 50%; background: var(--agent); }
.card .pick { position: absolute; right: 0.6rem; bottom: 0.55rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; border: 2px solid var(--line-strong); display: none; }
.selecting .card .pick { display: block; }
.sw.picked .card .pick { background: var(--accent); border-color: var(--accent); }
.md li.task input { width: 1.05rem; height: 1.05rem; }
#app.c-expanded .card .preview, #app.c-large .card .preview { max-height: 6rem; }
.dense .card .preview, .dense .card .meta { display: none; }
.dense .sw { margin: 0.15rem 0.5rem; }
.dense .card { padding: 0.45rem 0.7rem; }
.pill { position: sticky; top: 0.5rem; z-index: 3; display: flex; justify-content: center; height: 0; }
.pill button { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.82rem; box-shadow: var(--shadow-lg); }
.end { text-align: center; color: var(--faint); font-size: 0.8rem; padding: 1rem 1rem 2rem; }
.empty { text-align: center; color: var(--muted); padding: 3rem 1.5rem; }
.empty b { color: var(--ink); display: block; font-size: 1rem; margin-bottom: 0.3rem; }
.hintrow { font-size: 0.72rem; color: var(--faint); padding: 0.3rem 0.85rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }

/* Rows: trash, tasks, sources, extensions, places */
.row { display: flex; gap: 0.7rem; align-items: center; padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--line); background: var(--bg); min-height: 3.2rem; }
.row.focus { background: var(--selection); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; font-size: 0.92rem; }
.row .s { font-size: 0.78rem; color: var(--muted); }
.row .s.why { color: var(--warn); }
.left { width: 3.5rem; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: none; }
.left i { display: block; height: 100%; background: var(--warn); }
.left.soon i { background: var(--bad); }
.sw.rowsw { margin: 0; border-radius: 0; }
.sw.rowsw .card { border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: 0.65rem 0.85rem; background: var(--bg); }
.callout { font-size: 0.8rem; color: var(--muted); border-left: 2px solid var(--line-strong); padding: 0.2rem 0.7rem; margin: 0.75rem 0.85rem; }
select.ovr { font: inherit; font-size: 0.78rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg-elev); color: var(--ink); padding: 0.2rem; }

/* Places list (sidebar and sheet) */
.plist h4 { margin: 0.9rem 0.85rem 0.25rem; font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.place { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.85rem; color: var(--ink-2); cursor: pointer; }
#places .place { padding: 0.3rem 0.85rem; font-size: 0.85rem; color: var(--muted); }
.place .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.place .count { font-size: 0.75rem; color: var(--faint); }
.place .k { font-family: var(--mono); font-size: 0.68rem; color: var(--faint); }
.place[aria-current="true"] { color: var(--ink); background: var(--line); }
#places .place:hover { color: var(--ink); background: var(--hover); }
.place .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.kept { margin: 0.6rem 0.85rem; font-size: 0.78rem; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 0.5rem 0.7rem; }

/* Bottom bar */
#bar, .top, .chips, .sheet .handle, .act, .place { user-select: none; -webkit-user-select: none; }
#bar { grid-area: bar; display: flex; border-top: 1px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
#bar[hidden] { display: none; }
#bar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; padding: 0.4rem 0 0.45rem; font-size: 0.68rem; color: var(--muted); }
#bar button .g { font-size: 1.15rem; line-height: 1.3; }
#bar button[aria-current="true"] { color: var(--accent-ink); }
#bar.select button { color: var(--ink); }
#bar .badge2 { position: absolute; margin-left: 1.3rem; margin-top: -0.1rem; font-size: 0.6rem; background: var(--agent); color: #fff; border-radius: 999px; padding: 0 0.3rem; }

/* Note */
.note { padding: 1rem 1.1rem 6rem; max-width: 44rem; margin: 0 auto; width: 100%; }
.note .md h1 { font-size: 1.45rem; margin: 0 0 0.6rem; }
.note .md { font-size: 1rem; }
.note .md li { line-height: 1.6; }
.note .crumbs { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.6rem; display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
.banner { border: 1px solid var(--line-strong); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.8rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-strong); border-radius: 7px; padding: 0.35rem 0.8rem; background: var(--bg-elev); font-size: 0.85rem; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
textarea.ed { width: 100%; min-height: 50vh; border: 0; outline: none; resize: none; background: transparent; color: var(--ink); font: 1rem/1.6 var(--mono); padding: 0; }
.tabs2 { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs2 .tab { cursor: pointer; }
.tabs2 .tab .x { padding-left: 0.2rem; }

  };
  input.addEventListener("focus", renderOsk); input.addEventListener("blur", () => setTimeout(renderOsk, 50));
  el.querySelectorAll("[data-op]").forEach((b) => b.addEventListener("click", () => { const parts = S.search.q.split(/\s+/).filter(Boolean); const op = b.dataset.op; S.search.q = (parts.includes(op) ? parts.filter((x) => x !== op) : [...parts, op]).join(" ") + " "; renderSearch(); }));
  el.querySelectorAll("[data-r]").forEach((d) => d.addEventListener("click", () => { const r = flat[+d.dataset.r]; S.search = null; render(); r.go(); }));
  const all = $("[data-all]", el); if (all) all.onclick = seeAll;
  const c = $("[data-cancel]", el); if (c) c.onclick = closeSearch;
  if (wide) { const sc = document.createElement("div"); sc.className = "scrim on"; sc.style.zIndex = 29; sc.onclick = closeSearch; el.before(sc); sc.classList.add("search-scrim"); }
}
function seeAll() { const q = S.search.q.trim(); S.search = null; if (q) { S.place = "q:" + q; S.sel = 0; S.showDetail = false; } render(); }
function saveSearch() { const q = S.place.slice(2); const id = "s:" + q.toLowerCase().replace(/[^a-z0-9]+/g, "-"); S.saved.push({ id, title: q.replace(/\b\w+:\S*/g, "").trim() || q, query: q }); S.place = id; snack("Saved in Places"); render(); }

// ======================= Actions =======================
function snack(text, undo) {
  const dev = document.getElementById("device");
  dev.querySelectorAll(".snack").forEach((x) => x.remove());
  const el = document.createElement("div"); el.className = "snack"; el.setAttribute("role", "status");
  el.innerHTML = `<span>${text}</span>${undo ? `<button>Undo</button>` : ""}`;
  if (undo) $("button", el).onclick = () => { el.remove(); doUndo(); };
  dev.append(el); clearTimeout(snack.t); snack.t = setTimeout(() => el.remove(), 5000);
}
function doUndo() { const u = S.undo.pop(); if (!u) return snack("Nothing to undo"); u(); snack("Undone"); render(); }
const pickedNotes = () => S.notes.filter((n) => S.selecting?.has(n.id));
function act(kind, ns, onOff = true) {
  if (!ns.length) return;
  const label = ns.length > 1 ? `${ns.length} notes` : `“${esc(titleOf(ns[0]))}”`;
  if (kind === "archive") { const was = ns.map((n) => [n, n.archived]); ns.forEach((n) => { n.archived = onOff; n.seen = true; }); S.undo.push(() => was.forEach(([n, a]) => (n.archived = a))); snack(`${onOff ? "Archived" : "Unarchived"} ${label}`, true); }
  if (kind === "pin") { const v = !ns.every((n) => n.pinned); const was = ns.map((n) => [n, n.pinned]); ns.forEach((n) => (n.pinned = v)); S.undo.push(() => was.forEach(([n, p]) => (n.pinned = p))); snack(`${v ? "Pinned" : "Unpinned"} ${label}`, true); }
  if (kind === "trash") {
    const es = ns.map((n) => ({ note: n, deletedAgo: 0, by: "you", index: S.notes.indexOf(n) }));
    S.notes = S.notes.filter((n) => !ns.includes(n)); S.trash.unshift(...es);
    if (ns.some((n) => n.path === S.note)) { S.tabs = S.tabs.filter((p) => !ns.some((n) => n.path === p)); S.note = S.tabs[0] || null; S.showDetail = false; S.editing = false; }
    S.undo.push(() => es.forEach((e) => { S.trash.splice(S.trash.indexOf(e), 1); S.notes.splice(e.index, 0, e.note); }));
    snack(`Moved ${label} to Trash`, true);
  }
  S.selecting = null; S.hintSeen = true;
  render();
}
function restore(i) {
  const x = S.trash[i]; if (!x) return;
  S.trash.splice(i, 1); x.note.ago = 0; x.note.by = "you"; x.note.seen = true; x.note.archived = false; x.note.summary = "Restored from Trash";
  (x.note.history ||= []).unshift({ by: "you", ago: 0, add: 3, del: 0, summary: "Restored from Trash (undid the delete)" });
  S.notes.unshift(x.note); S.trashPeek = null;
  S.undo.push(() => { S.notes.splice(S.notes.indexOf(x.note), 1); S.trash.splice(i, 0, x); });
  snack(`Restored “${esc(titleOf(x.note))}”, with its history`, true); render();
}
function purge(i) {
  const x = S.trash[i]; if (!x) return;
  openSheet({ kind: "confirm", title: `Delete “${titleOf(x.note)}” forever?`, body: "Its text leaves history too, so nothing can bring it back. Agents can't do this.", ok: "Delete forever", yes: () => { S.trash.splice(i, 1); S.trashPeek = null; snack("Deleted forever. History keeps a line saying so."); render(); } });
}
function emptyTrash() { if (!S.trash.length) return; openSheet({ kind: "confirm", title: "Empty Trash?", body: `${S.trash.length} notes leave history for good.`, ok: "Empty Trash", yes: () => { S.trash = []; snack("Trash is empty"); render(); } }); }
function tick(n, k) { toggleTask(n, k); n.ago = 0; n.by = "you"; n.summary = "Ticked a task"; n.history.unshift({ by: "you", ago: 0, add: 1, del: 1, summary: "Ticked a task" }); }
function newNote() { const path = `Notes/Untitled ${++uid}.md`; S.notes.unshift({ id: uid, path, text: "# Untitled\n\n", by: "you", ago: 0, add: 2, del: 0, seen: true, history: [{ by: "you", ago: 0, add: 2, del: 0, summary: "Made the note" }] }); openNote(path); S.editing = true; render(); }

// ======================= Navigation =======================
function go(id) {
  S.search = null; S.editing = false;
  if (id === "search") return openSearch("");
  if (id === "more") return openSheet({ kind: "places" });
  if (id === "bar") return openSheet({ kind: "bar" });
  if (id === "today") return openNote("Journal/2026-10-05.md");
  if (id.startsWith("note:")) return openNote(id.slice(5));
  S.place = id; S.sel = 0; S.loaded = 25; S.showDetail = false; S.selecting = null; S.event = null;
  render();
  const sc = $("#list .scroll"); if (sc) sc.scrollTop = 0;
}
/** Opening a note replaces the preview tab, as the desktop does, so a phone never piles up tabs. */
function openNote(path) {
  const n = noteByPath(path); if (!n) return;
  n.seen = true;
  if (!S.tabs.includes(path)) { const i = S.tabs.indexOf(S.previewTab); if (i >= 0) S.tabs[i] = path; else S.tabs.push(path); S.previewTab = path; }
  S.note = path; S.showDetail = true; S.editing = false; S.search = null;
  render();
}
function openEvent(id) {
  S.event = id;
  if (atLeast(C.width, "expanded") && on("workbench.splits")) { S.place = "calendar"; S.sel = calEvents().findIndex((e) => e.id === id); render(); }
  else openSheet({ kind: "event", id });
}
function back() {
  if (S.editing) return finishEdit();
  if (S.sheet) return closeSheet();
  if (S.search) return closeSearch();
  if (S.selecting) { S.selecting = null; return render(); }
  if (S.showDetail) { S.showDetail = false; return render(); }
}

// ======================= Keys (only where a keyboard is) =======================
document.addEventListener("keydown", (e) => {
  if (!e.isTrusted) return;
  const inField = inText(e);
  // Detection, as the app would do it: a key outside a text field means a hardware keyboard.
  if (preset === "fit" && !S.detected && !inField && !e.repeat && (e.key.length === 1 || /^(Escape|Tab|Arrow)/.test(e.key))) {
    const had = caps().keyboard; S.detected = true;
    if (!had) { snack("Keyboard found: Vim and shortcuts are on here. See Extensions."); render(); }
  }
  if (inField) { if (e.key === "Escape" && S.editing) { e.preventDefault(); finishEdit(); } return; }
  const C1 = caps();
  if (!C1.keyboard) { if (!keysHinted && (e.key.length === 1 || e.key === "Escape")) { keysHinted = true; snack("This simulated device has no keyboard. Pick one with a keyboard to try the keys."); } return; }
  if (!on("keys")) return;
  if (S.sheet) { if (e.key === "Escape" || e.key === "?") { e.preventDefault(); closeSheet(); } return; }
  if (isMod(e) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(""); return; }
  if (isMod(e) && e.key.toLowerCase() === "b") { e.preventDefault(); S.placesOpen = !S.placesOpen; render(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.pending === "g") { S.pending = ""; const m = { f: "feed", d: "today", t: "tasks", c: "calendar", a: "archive", x: "trash", s: "sources", e: "extensions", ",": "settings", "/": "search" }[e.key]; if (m) { e.preventDefault(); go(m); } else render(); return; }
  if (e.key === "g") { S.pending = "g"; render(); return; }
  if (e.key === "?") { openSheet({ kind: "keys" }); return; }
  if (e.key === "Escape") { back(); return; }
  if (e.key === "/") { e.preventDefault(); openSearch(""); return; }
  if (e.key === "u") { doUndo(); return; }
  const len = listLength();
  const move = (by) => { S.sel = Math.max(0, Math.min(len - 1, S.sel + by)); if (isNoteList(S.place) && atLeast(C1.width, "expanded") && on("workbench.splits")) { const n = notesFor(S.place)[S.sel]; if (n) { S.note = n.path; n.seen = true; if (!S.tabs.includes(n.path)) openNote(n.path); } } if (S.place === "calendar" && atLeast(C1.width, "expanded")) S.event = calEvents()[S.sel]?.id; if (S.place === "trash" && atLeast(C1.width, "expanded")) S.trashPeek = S.sel; render(); };
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); return; }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); return; }
  if (e.key === "G") { move(len); return; }
  if (isNoteList(S.place)) {
    const n = notesFor(S.place)[S.sel]; if (!n) return;
    const ns = S.selecting?.size ? pickedNotes() : [n];
    if (e.key === "Enter" || e.key === "o") openNote(n.path);
    else if (e.key === "e") act("archive", ns, !ns[0].archived);
    else if (e.key === "#") act("trash", ns);
    else if (e.key === "p") act("pin", ns);
    else if (e.key === "x") { S.selecting ||= new Set(); S.selecting.has(n.id) ? S.selecting.delete(n.id) : S.selecting.add(n.id); if (!S.selecting.size) S.selecting = null; move(1); }
  } else if (S.place === "trash") { if (e.key === "r") restore(S.sel); else if (e.key === "D") purge(S.sel); else if (e.key === "Enter") { S.trashPeek = S.sel; atLeast(C1.width, "expanded") ? render() : openSheet({ kind: "trashPeek", i: S.sel }); } }
  else if (S.place === "calendar" && e.key === "Enter") openEvent(calEvents()[S.sel].id);
  else if (S.place === "tasks" && (e.key === "x" || e.key === " ")) { e.preventDefault(); const t = allTasks()[S.sel]; if (t) { tick(t.n, t.k); render(); } }
  else if (S.place === "tasks" && e.key === "Enter") { const t = allTasks()[S.sel]; if (t) openNote(t.n.path); }
});
let keysHinted = false;

// ======================= The rig =======================
const rDevice = document.getElementById("rDevice");
rDevice.innerHTML = Object.entries(PRESETS).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join("");
function fitDevice() {
  const dev = document.getElementById("device"), stage = document.getElementById("stage");
  const p = PRESETS[preset];
  if (!p.w) { delete document.documentElement.dataset.framed; dev.style.cssText = ""; return; }
  document.documentElement.dataset.framed = "";
  const k = Math.min(1, (stage.clientWidth - 24) / p.w, (stage.clientHeight - 24) / p.h);
  dev.style.width = p.w + "px"; dev.style.height = p.h + "px"; dev.style.transform = `translate(-50%, -50%) scale(${k})`;
}
rDevice.onchange = () => { preset = rDevice.value; try { localStorage.setItem("ci-proto-device", preset); } catch {} S.sheet = null; fitDevice(); render(); };
document.getElementById("rTheme").onchange = (e) => { if (e.target.value) document.documentElement.dataset.theme = e.target.value; else delete document.documentElement.dataset.theme; };
document.getElementById("rReset").onclick = () => { reset(); render(); };
document.getElementById("rHide").onclick = () => { const r = document.getElementById("rig"); if (r.hasAttribute("data-min")) r.removeAttribute("data-min"); else r.setAttribute("data-min", ""); fitDevice(); render(); };
document.getElementById("rAgent").onclick = () => {
  const pool = S.notes.filter((n) => !n.archived && n.ago > HOUR && !n.pinned).slice(0, 10);
  const n = pool[Math.floor(Math.random() * pool.length)];
  n.text += "\n- Claude: added a follow-up"; n.ago = 0; n.by = "claude"; n.summary = "Added a follow-up"; n.seen = false; n.add = 1; n.del = 0;
  n.history.unshift({ by: "claude", ago: 0, add: 1, del: 0, summary: "Added a follow-up" });
  const sc = $("#list .scroll"); if (S.place === "feed" && sc && sc.scrollTop > 40) S.newCount++;
  snack(`Claude changed “${esc(titleOf(n))}”`); render();
};
new ResizeObserver(() => { const w = widthClass(app.clientWidth); if (C && w !== C.width) render(); }).observe(document.getElementById("device"));
addEventListener("resize", fitDevice);
if (window.visualViewport) visualViewport.addEventListener("resize", () => { const kb = innerHeight - visualViewport.height; app.style.bottom = preset === "fit" && kb > 80 ? kb + "px" : ""; });

reset();
try { const d = new URLSearchParams(location.search).get("device") || localStorage.getItem("ci-proto-device"); if (d && PRESETS[d]) preset = d; } catch {}
if (preset === "fit" && innerWidth >= 700 && !new URLSearchParams(location.search).get("device")) preset = "phone";
if (innerWidth < 600) { preset = "fit"; document.getElementById("rig").setAttribute("data-min", ""); }
rDevice.value = preset;
fitDevice();
render();
</script>
</body>
</html>
