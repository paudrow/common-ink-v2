<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Places and Feed</title>
<style>
/* The app's tokens (web/src/style.css), so the prototype reads like Common Ink. */
:root {
  color-scheme: light dark;
  --bg: #fbfaf8;
  --ink: #1f1e1c;
  --muted: #6f6b66;
  --line: #e7e4df;
  --accent: #2f5fd0;
  --selection: #d6e0f7;
  --accent-soft: rgb(47 95 208 / 0.14);
  --code-bg: rgb(31 30 28 / 0.05);
  --hover: rgb(31 30 28 / 0.06);
  --bg-elev: #ffffff;
  --line-strong: #d6d2cb;
  --faint: #a9a49d;
  --ink-2: #3d3a36;
  --accent-ink: #2450b8;
  --on-accent: #ffffff;
  --bad: #c2410c;
  --warn: #b7791f;
  --ok: #2f8f5b;
  --agent: #7a4fc4;
  --agent-soft: rgb(122 79 196 / 0.12);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.14), 0 2px 6px rgb(0 0 0 / 0.08);
  --prose: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-family: var(--prose);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --ink: #e8e6e3; --muted: #9a958f; --line: #2c2b29; --accent: #8fb0ff;
    --selection: #2c3a5c; --accent-soft: rgb(143 176 255 / 0.16); --code-bg: rgb(232 230 227 / 0.06);
    --hover: rgb(232 230 227 / 0.08); --bg-elev: #22211f; --line-strong: #3d3b38; --faint: #6b6762;
    --ink-2: #cfccc7; --accent-ink: #a9c2ff; --on-accent: #10131a; --bad: #f0855a; --warn: #e0a84a;
    --ok: #5cc28c; --agent: #b99cf0; --agent-soft: rgb(185 156 240 / 0.14);
    --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.3);
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --ink: #e8e6e3; --muted: #9a958f; --line: #2c2b29; --accent: #8fb0ff;
  --selection: #2c3a5c; --accent-soft: rgb(143 176 255 / 0.16); --code-bg: rgb(232 230 227 / 0.06);
  --hover: rgb(232 230 227 / 0.08); --bg-elev: #22211f; --line-strong: #3d3b38; --faint: #6b6762;
  --ink-2: #cfccc7; --accent-ink: #a9c2ff; --on-accent: #10131a; --bad: #f0855a; --warn: #e0a84a;
  --ok: #5cc28c; --agent: #b99cf0; --agent-soft: rgb(185 156 240 / 0.14);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
kbd { font-family: var(--mono); font-size: 0.75rem; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3rem; color: var(--ink-2); background: var(--bg-elev); white-space: nowrap; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Tabs and status bar, as the app draws them. */
.tabs { display: flex; border-bottom: 1px solid var(--line); min-height: 33px; overflow-x: auto; flex: none; }
.tab { padding: 0.45rem 0.75rem; font-size: 0.8125rem; color: var(--muted); border-right: 1px solid var(--line); display: flex; gap: 0.5rem; align-items: center; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.tab .x { color: var(--faint); font-size: 0.8rem; }
.status { grid-area: status; display: flex; gap: 1rem; padding: 0.3rem 1rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); border-top: 1px solid transparent; }
.status .grow { flex: 1; }

/* Rendered markdown (cards and notes). */
.md h1 { font-size: 1.05rem; margin: 0 0 0.35rem; }
.md h2 { font-size: 0.95rem; margin: 0.6rem 0 0.25rem; }
.md h3 { font-size: 0.9rem; margin: 0.5rem 0 0.2rem; }
.md p { margin: 0.25rem 0; line-height: 1.5; }
.md ul { margin: 0.25rem 0; padding-left: 1.25rem; }
.md li { line-height: 1.5; }
.md li.task { list-style: none; margin-left: -1.25rem; display: flex; gap: 0.45rem; align-items: baseline; }
.md li.task input { margin: 0; accent-color: var(--accent); transform: translateY(1px); }
.md li.task.done span { color: var(--muted); text-decoration: line-through; }
.md code { font-family: var(--mono); font-size: 0.85em; background: var(--code-bg); padding: 0 0.25rem; border-radius: 3px; }
.md a, .md .wikilink { color: var(--accent-ink); text-decoration: none; }
.chip { display: inline-flex; gap: 0.35rem; align-items: center; border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 0.4rem; font-size: 0.85em; background: var(--bg-elev); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.chip .when { color: var(--muted); }
.due { font-size: 0.75rem; border-radius: 4px; padding: 0 0.3rem; background: var(--code-bg); color: var(--muted); font-family: var(--mono); }
.due.over { color: var(--bad); }
.embed-ph { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; padding: 0.35rem 0.6rem; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); font-size: 0.8125rem; }
.embed-ph b { color: var(--ink-2); font-weight: 600; }
.embed-live { margin: 0.35rem 0; padding: 0.5rem 0.6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-elev); font-size: 0.8125rem; }
.embed-live .big { font-family: var(--mono); font-size: 1.2rem; }
.embed-live .cal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
.embed-live .cal div { border-left: 2px solid var(--accent); padding-left: 0.4rem; }
.embed-live .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
.embed-live .board div { background: var(--code-bg); border-radius: 4px; padding: 0.3rem; }

/* Authors */
.who { font-weight: 600; color: var(--ink-2); }
.who.agent { color: var(--agent); }
.badge { font-size: 0.7rem; border-radius: 999px; padding: 0 0.4rem; background: var(--code-bg); color: var(--muted); }
.badge.agent { background: var(--agent-soft); color: var(--agent); }
.badge.archived { background: var(--code-bg); color: var(--muted); }
.stat { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.stat .add { color: var(--ok); }
.stat .del { color: var(--bad); }

/* Overlays: toast, dialogs, the keys sheet and the prototype's controls. */
.toast { position: fixed; left: 50%; bottom: 2.5rem; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 0.8125rem; box-shadow: var(--shadow-lg); display: flex; gap: 0.75rem; align-items: center; z-index: 50; }
.toast button { color: var(--bg); text-decoration: underline; }
.toast kbd { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.25); display: grid; place-items: start center; padding-top: 12vh; z-index: 40; }
.dialog { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); width: min(680px, 92vw); max-height: 72vh; display: flex; flex-direction: column; overflow: hidden; }
.dialog.small { width: min(420px, 92vw); padding: 1rem 1.1rem; gap: 0.6rem; }
.dialog .row { display: flex; gap: 0.5rem; justify-content: flex-end; }
.btn { border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.25rem 0.7rem; background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.keys-sheet { padding: 1rem 1.25rem; overflow: auto; columns: 2; column-gap: 2rem; font-size: 0.8125rem; }
.keys-sheet h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0.75rem 0 0.35rem; break-after: avoid; }
.keys-sheet div { display: flex; justify-content: space-between; gap: 1rem; padding: 0.12rem 0; break-inside: avoid; }
.proto { position: fixed; right: 0.75rem; bottom: 2rem; z-index: 30; font-size: 0.75rem; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 0.55rem 0.7rem; display: grid; gap: 0.35rem; min-width: 220px; }
.proto[hidden] { display: none; }
.proto b { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.proto label { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
.proto select, .proto button { font: inherit; font-size: 0.75rem; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--ink); padding: 0.1rem 0.3rem; }


body { display: grid; grid-template: "places main panel" 1fr "status status status" auto / var(--places-w, 15rem) 1fr var(--panel-w, 19rem); }
body.no-places { --places-w: 0px; }
body.no-panel { --panel-w: 0px; }
body.no-places #places, body.no-panel #panel { display: none; }

/* Places: one text list, no icon bar. */
#places { grid-area: places; border-right: 1px solid var(--line); overflow: auto; padding: 0.6rem 0.4rem; font-size: 0.8125rem; display: flex; flex-direction: column; }
#places h4 { margin: 0.9rem 0.5rem 0.25rem; font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.place { display: flex; align-items: center; gap: 0.5rem; padding: 0.22rem 0.5rem; border-radius: 4px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.place .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.place .count { font-size: 0.72rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.place .key { font-family: var(--mono); font-size: 0.68rem; color: var(--faint); opacity: 0; }
#places:focus-within .place .key, body.show-keys .place .key { opacity: 1; }
.place:hover { color: var(--ink); background: var(--hover); }
.place[aria-current="true"] { color: var(--ink); background: var(--line); }
.place.cursor { outline: 1px solid var(--accent); outline-offset: -1px; }
.place .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.place .dot.unseen { background: var(--agent); }
.place .moved { animation: flash 0.6s; }
#places .spacer { flex: 1; min-height: 1rem; }
#places .sep { border-top: 1px solid var(--line); margin: 0.5rem 0.5rem; }

/* The main area: tabs, then one or two panes. */
#main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#panes { flex: 1; display: flex; min-height: 0; }
.pane { flex: 1; min-width: 0; overflow: auto; position: relative; }
.pane + .pane { border-left: 1px solid var(--line); }
.zone-focus { box-shadow: inset 0 2px 0 var(--accent-soft); }

/* Feed */
.feed { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 4rem; }
.feed-head { position: sticky; top: 0; background: var(--bg); z-index: 2; padding: 0.9rem 0 0.5rem; border-bottom: 1px solid var(--line); }
.feed-head .row1 { display: flex; align-items: baseline; gap: 0.75rem; }
.feed-head h2 { font-size: 1.05rem; margin: 0; }
.feed-head .q { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filters { display: flex; gap: 0.25rem; margin-top: 0.5rem; align-items: center; }
.filters button { font-size: 0.8rem; padding: 0.15rem 0.6rem; border-radius: 999px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.filters .n { font-size: 0.7rem; color: var(--agent); margin-left: 0.2rem; }
.filters button[aria-pressed="true"] .n { color: inherit; }
.filters .grow { flex: 1; }
.filters input { font: inherit; font-size: 0.8rem; border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.15rem 0.5rem; background: var(--bg-elev); color: var(--ink); width: 14rem; }
.group { font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); margin: 1.1rem 0 0.4rem; font-weight: 600; }
.card { scroll-margin: 7.5rem 0 1rem; border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem 0.9rem 0.6rem; margin: 0.5rem 0; background: var(--bg-elev); position: relative; transition: opacity 0.18s, transform 0.18s; }
.card.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.picked { background: color-mix(in srgb, var(--selection) 55%, var(--bg-elev)); }
.card.leaving { opacity: 0; transform: translateX(24px); }
.card.arrived { animation: flash 1.2s; }
@keyframes flash { from { background: var(--accent-soft); } }
.card .top { display: flex; gap: 0.5rem; align-items: baseline; }
.card .title { font-weight: 600; font-size: 0.95rem; }
.card .folder { font-size: 0.75rem; color: var(--faint); }
.card .when { margin-left: auto; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.card .meta { display: flex; gap: 0.45rem; align-items: center; font-size: 0.78rem; color: var(--muted); margin: 0.15rem 0 0.35rem; flex-wrap: wrap; }
.card .unseen { width: 7px; height: 7px; border-radius: 50%; background: var(--agent); position: absolute; left: -4px; top: 1rem; }
.card .pin { color: var(--accent); font-size: 0.8rem; }
.card .preview { font-size: 0.86rem; color: var(--ink-2); max-height: 13.5rem; overflow: hidden; -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
.card .preview h1 { display: none; }
.card .hint { display: none; font-size: 0.72rem; color: var(--faint); margin-top: 0.35rem; gap: 0.6rem; flex-wrap: wrap; }
.card.focus .hint { display: flex; }
.card .diff { font-family: var(--mono); font-size: 0.75rem; background: var(--code-bg); border-radius: 6px; padding: 0.4rem 0.6rem; margin: 0.35rem 0; white-space: pre-wrap; }
.card .diff .a { color: var(--ok); }
.card .diff .d { color: var(--bad); }
.rows .card { padding: 0.35rem 0.7rem; margin: 0.15rem 0; border-radius: 5px; }
.rows .card .preview, .rows .card .meta { display: none; }
.pill { position: sticky; top: 6.2rem; z-index: 3; display: flex; justify-content: center; height: 0; }
.pill button { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0.25rem 0.8rem; font-size: 0.8rem; box-shadow: var(--shadow-lg); transform: translateY(0.4rem); }
.more { text-align: center; color: var(--faint); font-size: 0.8rem; padding: 1rem; }
.empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }
.empty b { color: var(--ink); display: block; font-size: 1rem; margin-bottom: 0.25rem; }

/* A note, read-only in the prototype */
.note { max-width: 42rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; font-size: 0.95rem; }
.note .md h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
.note .crumbs { font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.banner { border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.4rem 0.7rem; font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: center; }

/* Trash and other lists */
.list { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 3rem; }
.row { display: flex; gap: 0.75rem; align-items: center; padding: 0.45rem 0.6rem; border-radius: 6px; border: 1px solid transparent; }
.row.focus { border-color: var(--accent); background: var(--bg-elev); }
.row .t { font-weight: 600; font-size: 0.875rem; }
.row .sub { font-size: 0.75rem; color: var(--muted); }
.row .grow { flex: 1; min-width: 0; }
.left { width: 5.5rem; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.left i { display: block; height: 100%; background: var(--warn); }
.left.soon i { background: var(--bad); }
.callout { font-size: 0.8rem; color: var(--muted); border-left: 2px solid var(--line-strong); padding: 0.2rem 0.7rem; margin: 0.75rem 0; }

/* Calendar (simplified) */
.cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.6rem; padding: 1rem 1.25rem; }
.cal h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 0.4rem; }
.ev { border-left: 3px solid var(--accent); background: var(--bg-elev); border-radius: 4px; padding: 0.3rem 0.5rem; margin-bottom: 0.35rem; font-size: 0.8rem; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ev.focus { box-shadow: 0 0 0 2px var(--accent); }
.ev .tm { color: var(--muted); font-size: 0.72rem; }
.evdetail { margin: 0 1.25rem; border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem 1rem; background: var(--bg-elev); font-size: 0.85rem; }
.evdetail h3 { margin: 0 0 0.25rem; }

/* Context panel */
#panel { grid-area: panel; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; font-size: 0.8125rem; }
#panel .ptabs { display: flex; gap: 0.1rem; padding: 0.35rem 0.5rem 0; border-bottom: 1px solid var(--line); align-items: flex-end; }
#panel .ptabs button { padding: 0.3rem 0.5rem; color: var(--muted); font-size: 0.78rem; border-radius: 4px 4px 0 0; }
#panel .ptabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
#panel .ptabs .grow { flex: 1; }
#panel .pbody { overflow: auto; padding: 0.6rem 0.75rem; flex: 1; }
.change { padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
.change .l1 { display: flex; gap: 0.4rem; align-items: baseline; }
.change .l1 .grow { flex: 1; }
.change.focus { background: var(--hover); }
.menu { position: absolute; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 0.25rem; z-index: 45; min-width: 12rem; font-size: 0.8125rem; }
.menu div { padding: 0.3rem 0.6rem; border-radius: 4px; display: flex; justify-content: space-between; gap: 1rem; cursor: pointer; }
.menu div.focus, .menu div:hover { background: var(--hover); }

/* Search */
.search input.q { font: inherit; font-size: 1rem; border: 0; border-bottom: 1px solid var(--line); padding: 0.8rem 1rem; background: transparent; color: var(--ink); outline: none; width: 100%; }
.search .results { overflow: auto; padding: 0.25rem 0.4rem 0.5rem; }
.search .sec { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); padding: 0.55rem 0.6rem 0.2rem; font-weight: 600; display: flex; justify-content: space-between; }
.res { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.32rem 0.6rem; border-radius: 5px; cursor: pointer; }
.res.focus { background: var(--selection); }
.res .k { width: 1.1rem; color: var(--faint); text-align: center; flex: none; }
.res .t { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .d { color: var(--muted); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.res .r { color: var(--faint); font-size: 0.75rem; white-space: nowrap; }
.res.dim .t { color: var(--muted); }
.res mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
.search .foot { border-top: 1px solid var(--line); padding: 0.4rem 0.8rem; font-size: 0.72rem; color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; }
.ops { display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0.5rem 0.8rem 0.2rem; }
.ops button { font-family: var(--mono); font-size: 0.75rem; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 0.35rem; color: var(--ink-2); }
.ops button.focus { background: var(--selection); }
.json { font-family: var(--mono); font-size: 0.78rem; background: var(--code-bg); border-radius: 6px; padding: 0.6rem 0.8rem; white-space: pre; overflow: auto; margin: 0.4rem 0 1rem; }
.settings-grid { display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1rem; font-size: 0.82rem; margin: 0.4rem 0 1rem; }
.settings-grid .mono { color: var(--accent-ink); }
@media (max-width: 760px) {
  body { --places-w: 0px; --panel-w: 0px; }
  #places, #panel { display: none; }
}
</style>
</head>
<body>
<nav id="places" aria-label="Places"></nav>
<main id="main">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="panes"></div>
</main>
<aside id="panel" aria-label="Context panel"></aside>
<footer class="status" id="status"></footer>
<div class="proto" id="proto" hidden>
  <b>Prototype controls</b>
  <label>Theme <select id="pTheme"><option value="">System</option><option>light</option><option>dark</option></select></label>

function renderMarkdown(text, { live = false, limit = Infinity, noteIndex = -1 } = {}) {

      out.push(embedHtml(m[1], { cols }, live)); shown += 2; continue;
    }
    if (!line.trim()) { close(); continue; }
    shown++;
    if ((m = line.match(/^(#{1,3}) (.*)/))) { close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }

function feedItems(t) {
  const v = view(t.id);
  let q = t.query || "";
  if (t.id === "feed") q = "";
  if (t.id === "archive") q = "is:archived";
  const p = parseQuery([q, v.query].join(" "));
  let items = S.notes.filter((n) => {
    if (p.is.includes("archived")) { if (!n.archived) return false; }
    else if (n.archived) {
      // Archived notes stay out of the Feed. An agent's change to one shows under Agents, marked archived,
      // unless the setting brings it back.
      if (!(t.id === "feed" && v.filter === "agents" && isAgent(n.by) && n.ago < 7 * DAY)) return false;
    }
    if (p.is.includes("pinned") && !n.pinned) return false;
    if (t.id === "feed" && v.filter === "mine" && n.by !== "you") return false;
    if (t.id === "feed" && v.filter === "agents" && !isAgent(n.by)) return false;
    if (!fromOk(p.from, n.by)) return false;
    if (p.in.length && !p.in.some((f) => n.path.toLowerCase().startsWith(f.replace(/\/?$/, "/")))) return false;
    if (!editedOk(p.edited, n.ago)) return false;
    if (p.has.includes("task") && !/\[( |x)\]/.test(n.text)) return false;
    if (p.has.includes("embed") && !/(^::|^```|^:::)/m.test(n.text)) return false;
    const hay = (n.path + " " + n.text).toLowerCase();
    if (!p.words.every((w) => hay.includes(w))) return false;
    if (p.not.some(([k, val]) => (k === "word" ? hay.includes(val) : k === "is" && val === "archived" ? n.archived : false))) return false;
    return true;
  });
  items.sort((a, b) => a.ago - b.ago);
  if (t.id === "feed" && v.filter === "all" && !v.query) items = [...items.filter((n) => n.pinned), ...items.filter((n) => !n.pinned)];
  return items;
}

/** A name for a saved search, in words, from its query. */
function nameFor(q) {
  const p = parseQuery(q);

  if (p.is.includes("archived")) parts.push("Archived");
  if (p.is.includes("pinned")) parts.push("Pinned");
  for (const f of p.from) parts.push({ me: "Mine", agent: "Agent edits", claude: "Claude's edits", research: "Research agent's edits", sync: "From sync" }[f] || f);
  for (const f of p.in) parts.push(f.replace(/\/$/, "").replace(/^./, (c) => c.toUpperCase()));
  for (const t of p.type) parts.push({ task: "Tasks", event: "Events", note: "Notes" }[t] || t);
  if (p.has.includes("task")) parts.push("with tasks");
  if (p.edited) parts.push({ today: "today", "<7d": "this week", "<30d": "this month", ">90d": "older than 90 days" }[p.edited] || "edited " + p.edited);

  });

let search = null;
function searchResults(q) {
  const raw = q.trim();
  if (raw.startsWith(">")) {
    const w = raw.slice(1).trim().toLowerCase();
    return [{ sec: "Commands", items: COMMANDS.filter((c) => c.t.toLowerCase().includes(w)).map((c) => ({ kind: "command", k: "›", t: c.t, r: c.key || "", run: c.run })) }];
  }
  const p = parseQuery(raw);
  const only = p.type;
  const want = (k) => !only.length || only.includes(k);
  const words = p.words;
  const match = (s) => words.every((w) => s.toLowerCase().includes(w));
  const mark = (s) => { let h = esc(s); for (const w of words) if (w) h = h.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); return h; };
  const secs = [];
  if (want("note")) {
    const pool = p.is.includes("trashed") ? S.trash.map((x) => ({ ...x.note, trashed: true })) : S.notes;
    let notes = pool.filter((n) => {
      if (p.is.includes("archived") && !n.archived) return false;
      if (p.is.includes("pinned") && !n.pinned) return false;
      if (!fromOk(p.from, n.by)) return false;
      if (p.in.length && !p.in.some((f) => n.path.toLowerCase().startsWith(f.replace(/\/?$/, "/")))) return false;
      if (!editedOk(p.edited, n.ago)) return false;
      if (p.has.includes("task") && !/\[( |x)\]/.test(n.text)) return false;
      if (p.has.includes("event") && !/event:/.test(n.text)) return false;
      if (p.not.some(([k, v]) => k === "is" && v === "archived" && n.archived)) return false;
      return match(n.path + " " + n.text);

  if (e.key === "?") { e.preventDefault(); keysSheet(); return; }
  if (S.pending === "g") {
    S.pending = "";
    const go = { f: "feed", "/": "search", d: "today", t: "tasks", c: "calendar", a: "archive", x: "trash", s: "sources", e: "extensions", ",": "settings" }[e.key];
    if (e.key === "g") { moveSel(0, 0); const p = $("#pane1"); if (p) p.scrollTop = 0; return; }
    if (go) { e.preventDefault(); openPlace({ id: go }); return; }
    renderStatus(); return;
  }
  if (e.key === "g") { S.pending = "g"; renderStatus(); return; }
  if (e.key === "u") { doUndo(); return; }
  const t = tab();
  if (S.focus === "places") { if (placesKey(e)) e.preventDefault(); else S.pending = ""; return; }
  if (S.focus === "panel") {
    if (e.key === "Tab") { e.preventDefault(); const i = S.panelViews.indexOf(S.panelView); S.panelView = S.panelViews[(i + 1) % S.panelViews.length]; render(); return; }
    if (e.key === "m") { panelMenu($("[data-pmenu]")); return; }
    if (e.key === "j" || e.key === "k") { S.panelCursor = Math.max(0, S.panelCursor + (e.key === "j" ? 1 : -1)); render(); return; }
    return;
  }
  if (S.focus === "side") { const p = $("#pane2"); if (p && (e.key === "j" || e.key === "k")) p.scrollBy(0, e.key === "j" ? 60 : -60); return; }
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); if (t.kind === "note") $("#pane1").scrollBy(0, 60); else moveSel(1); S.pending = ""; return; }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); if (t.kind === "note") $("#pane1").scrollBy(0, -60); else moveSel(-1); S.pending = ""; return; }
  if (e.key === "G") { moveSel(0, -1); return; }
  if (feedLike(t)) { const was = S.pending; if (feedKey(e, t)) e.preventDefault(); if (!(e.key === "d" && was === "")) S.pending = ""; if (was !== S.pending) renderStatus(); return; }
  S.pending = "";
  if (listKey(e, t)) e.preventDefault();
});

// ---------------- Prototype controls ----------------
$("#pTheme").onchange = (e) => { if (e.target.value) document.documentElement.dataset.theme = e.target.value; else delete document.documentElement.dataset.theme; };
$("#pLive").onchange = (e) => { S.liveEmbeds = e.target.value; liveReady = null; render(); armLive(); };
$("#pResurface").onchange = (e) => { S.resurface = e.target.checked; toast(S.resurface ? "An agent's edit now brings an archived note back to the Feed" : "Archived notes stay archived; agents' edits to them show under Agents"); };
$("#pReset").onclick = () => { reset(); render(); };
function simulateAgent() {
  const pool = S.notes.filter((n) => n.ago > HOUR && !n.pinned).slice(0, 12);
  const n = pool[Math.floor(Math.random() * pool.length)];
  const wasArchived = S.notes.find((x) => x.archived && x.path === "Research/Old competitor scan.md");
  const target = Math.random() < 0.3 && wasArchived ? wasArchived : n;
  target.text += `\n- Claude: added a follow-up (${new Date().toLocaleTimeString()})`;
  target.ago = 0; target.by = "claude"; target.add = 1; target.del = 0; target.summary = "Added a follow-up"; target.seen = false; target.arrived = true;
  target.history.unshift({ by: "claude", ago: 0, add: 1, del: 0, summary: "Added a follow-up" });
  if (target.archived && S.resurface) target.archived = false;
  const t = tab();
  const p = $("#pane1");
  if (feedLike(t) && p && p.scrollTop > 40) { view(t.id).newCount++; const v = view(t.id); v.sel = Math.min(v.sel + 1, feedItems(t).length - 1); }
  toast(`Claude changed “${esc(titleOf(target))}”${target.archived ? " (archived: it shows under Agents)" : ""}`);
  render();
  setTimeout(() => (target.arrived = false), 1500);
}
$("#pAgent").onclick = simulateAgent;
setTimeout(simulateAgent, 45000);

reset();
render();
armLive();
</script>
